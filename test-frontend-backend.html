<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Connection Test</title>
    <style>
        body { font-family: monospace; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .pass { background: #d4edda; border-color: #c3e6cb; }
        .fail { background: #f8d7da; border-color: #f5c6cb; }
        .pending { background: #fff3cd; border-color: #ffeaa7; }
        h2 { margin-top: 0; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔗 Frontend → Backend Connection Test</h1>
    <button onclick="runTests()">Run Tests</button>
    
    <div id="results"></div>

    <script>
        const FRONTEND_URL = 'https://www.divorcesmediator.com';
        const BACKEND_URL = 'https://mediation-app.onrender.com';
        
        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test pending"><h2>Running tests...</h2></div>';
            
            const tests = [
                { name: 'Backend Root', test: () => testEndpoint(`${BACKEND_URL}/`) },
                { name: 'Backend Health', test: () => testEndpoint(`${BACKEND_URL}/api/health`) },
                { name: 'Frontend Loading', test: () => testEndpoint(FRONTEND_URL) },
                { name: 'CORS Test', test: () => testCORS() }
            ];
            
            resultsDiv.innerHTML = '';
            
            for (const test of tests) {
                const result = await test.test();
                const div = document.createElement('div');
                div.className = `test ${result.pass ? 'pass' : 'fail'}`;
                div.innerHTML = `
                    <h2>${result.pass ? '✅' : '❌'} ${test.name}</h2>
                    <pre>${JSON.stringify(result.data, null, 2)}</pre>
                `;
                resultsDiv.appendChild(div);
            }
        }
        
        async function testEndpoint(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                return { pass: response.ok, data: { status: response.status, data } };
            } catch (error) {
                return { pass: false, data: { error: error.message } };
            }
        }
        
        async function testCORS() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/health`, {
                    method: 'GET',
                    headers: {
                        'Origin': FRONTEND_URL,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                return { 
                    pass: response.ok, 
                    data: { 
                        status: response.status, 
                        corsHeaders: {
                            'access-control-allow-origin': response.headers.get('access-control-allow-origin'),
                            'access-control-allow-credentials': response.headers.get('access-control-allow-credentials')
                        },
                        data 
                    } 
                };
            } catch (error) {
                return { pass: false, data: { error: error.message } };
            }
        }
    </script>
</body>
</html>
